<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Goals – Money Mission</title>
  <link rel="stylesheet" href="global.css"/>
  <link rel="stylesheet" href="dashboard.css"/>
</head>
<body>
<div id="money-bg"></div>
<div id="toast-container"></div>

<div class="app-layout">
  <main class="main-content" id="mainContent">

    <div class="page-header">
      <div>
        <div class="page-title">🎯 Financial Goals</div>
        <div class="page-sub">Set, track and crush your money goals.</div>
      </div>
      <button class="btn btn-gold" onclick="openModal('addGoalModal')">+ Add New Goal</button>
    </div>

    <!-- Filter tabs -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;" id="goalTabs">
      <button class="btn btn-gold btn-sm" data-filter="all"     onclick="filterGoals('all',this)">All Goals</button>
      <button class="btn btn-ghost btn-sm" data-filter="daily"  onclick="filterGoals('daily',this)">Daily</button>
      <button class="btn btn-ghost btn-sm" data-filter="weekly" onclick="filterGoals('weekly',this)">Weekly</button>
      <button class="btn btn-ghost btn-sm" data-filter="monthly"onclick="filterGoals('monthly',this)">Monthly</button>
      <button class="btn btn-ghost btn-sm" data-filter="yearly" onclick="filterGoals('yearly',this)">Yearly</button>
    </div>

    <!-- Goals List -->
    <div class="goals-list" id="goalsList"></div>

    <!-- Empty state -->
    <div id="goalsEmpty" style="display:none;text-align:center;padding:60px 20px;">
      <div style="font-size:52px;margin-bottom:16px;">🎯</div>
      <div style="font-family:var(--font-display);font-size:20px;font-weight:700;margin-bottom:8px;">No goals yet</div>
      <div style="color:var(--text-secondary);font-size:14px;margin-bottom:24px;">Create your first financial goal and start your journey.</div>
      <button class="btn btn-gold" onclick="openModal('addGoalModal')">Create First Goal</button>
    </div>

  </main>
</div>

<!-- Add/Edit Goal Modal -->
<div class="modal-overlay" id="addGoalModal">
  <div class="glass modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add New Goal</div>
      <button class="modal-close" onclick="closeModal('addGoalModal')">×</button>
    </div>
    <form id="goalForm" style="display:flex;flex-direction:column;gap:16px;">
      <input type="hidden" id="goalId"/>
      <div class="goal-form-grid">
        <div class="form-group full-width">
          <label class="form-label">Goal Name</label>
          <input class="form-control" id="gName" placeholder="e.g. Emergency Fund" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Target Amount (₹)</label>
          <input class="form-control" id="gTarget" type="number" placeholder="100000" min="1" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Current Amount (₹)</label>
          <input class="form-control" id="gCurrent" type="number" placeholder="0" min="0" value="0"/>
        </div>
        <div class="form-group">
          <label class="form-label">Deadline</label>
          <input class="form-control" id="gDeadline" type="date"/>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-control" id="gCategory">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly" selected>Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label class="form-label">Priority Level</label>
          <select class="form-control" id="gPriority">
            <option value="high">🔴 High</option>
            <option value="medium" selected>🟡 Medium</option>
            <option value="low">🔵 Low</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%;padding:14px;">Save Goal</button>
    </form>
  </div>
</div>

<script src="global.js"></script>
<script src="layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderLayout('goals.html', 'Goals');
  initMoneyBackground();
  initSidebar();
  loadGoals();
});

let currentFilter = 'all';

// Default goals if none exist
function getGoals() {
  const saved = store.get('goals', null);
  if (saved) return saved;
  const defaults = [
    { id: '1', name: 'Emergency Fund', target: 200000, current: 180000, deadline: '2025-12-31', category: 'yearly',  priority: 'high' },
    { id: '2', name: 'Goa Vacation',   target: 50000,  current: 27500,  deadline: '2025-09-01', category: 'monthly', priority: 'medium' },
    { id: '3', name: 'New Laptop',     target: 80000,  current: 24000,  deadline: '2026-03-01', category: 'monthly', priority: 'medium' },
    { id: '4', name: 'Daily Coffee Budget', target: 3000, current: 2100, deadline: '2025-06-30', category: 'daily', priority: 'low' },
    { id: '5', name: 'Weekly Groceries',    target: 2500, current: 1800, deadline: '2025-06-30', category: 'weekly', priority: 'medium' },
  ];
  store.set('goals', defaults);
  return defaults;
}

function loadGoals(filter) {
  if (filter) currentFilter = filter;
  const goals = getGoals();
  const list = document.getElementById('goalsList');
  const empty = document.getElementById('goalsEmpty');
  const filtered = currentFilter === 'all' ? goals : goals.filter(g => g.category === currentFilter);

  if (!filtered.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = filtered.map(goal => {
    const pct = Math.min(Math.round((+goal.current / +goal.target) * 100), 100);
    const fillClass = pct >= 80 ? 'green' : pct >= 40 ? '' : 'red';
    const priorityClass = `priority-${goal.priority}`;
    return `
      <div class="glass goal-card">
        <div class="goal-card-header">
          <div class="goal-info">
            <div class="goal-name">${goal.name}</div>
            <div class="goal-meta">
              <span class="badge ${priorityClass}">${goal.priority} priority</span>
              <span class="badge badge-blue">${goal.category}</span>
              ${goal.deadline ? `<span class="goal-meta-item">📅 ${formatDate(goal.deadline)}</span>` : ''}
            </div>
          </div>
          <div class="goal-actions">
            <button class="btn btn-ghost btn-sm btn-icon" onclick="editGoal('${goal.id}')" title="Edit">✏️</button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="deleteGoal('${goal.id}')" title="Delete">🗑️</button>
          </div>
        </div>
        <div class="goal-progress-row">
          <div class="goal-amounts">
            <strong>${formatCurrency(goal.current)}</strong>
            <span class="text-muted"> / ${formatCurrency(goal.target)}</span>
          </div>
          <div class="goal-pct">${pct}%</div>
        </div>
        <div class="progress-wrap">
          <div class="progress-fill ${fillClass}" id="gbar-${goal.id}" style="width:0%"></div>
        </div>
      </div>
    `;
  }).join('');

  // Animate bars
  setTimeout(() => {
    filtered.forEach(goal => {
      const pct = Math.min(Math.round((+goal.current / +goal.target) * 100), 100);
      const bar = document.getElementById('gbar-' + goal.id);
      if (bar) bar.style.width = pct + '%';
    });
  }, 80);
}

function filterGoals(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('#goalTabs .btn').forEach(b => {
    b.className = b === btn ? 'btn btn-gold btn-sm' : 'btn btn-ghost btn-sm';
  });
  loadGoals();
}

// Add / Edit
document.getElementById('goalForm').addEventListener('submit', e => {
  e.preventDefault();
  const id = document.getElementById('goalId').value;
  const goals = getGoals();
  const goal = {
    id: id || Date.now().toString(),
    name: document.getElementById('gName').value.trim(),
    target: +document.getElementById('gTarget').value,
    current: +document.getElementById('gCurrent').value || 0,
    deadline: document.getElementById('gDeadline').value,
    category: document.getElementById('gCategory').value,
    priority: document.getElementById('gPriority').value,
  };
  if (!goal.name || !goal.target) return showToast('Please fill required fields.', 'error');

  if (id) {
    const idx = goals.findIndex(g => g.id === id);
    if (idx > -1) goals[idx] = goal;
  } else {
    goals.push(goal);
  }
  store.set('goals', goals);
  closeModal('addGoalModal');
  loadGoals();
  showToast(id ? 'Goal updated! 🎯' : 'New goal created! 🚀', 'success');
});

function editGoal(id) {
  const goal = getGoals().find(g => g.id === id);
  if (!goal) return;
  document.getElementById('modalTitle').textContent = 'Edit Goal';
  document.getElementById('goalId').value   = goal.id;
  document.getElementById('gName').value    = goal.name;
  document.getElementById('gTarget').value  = goal.target;
  document.getElementById('gCurrent').value = goal.current;
  document.getElementById('gDeadline').value = goal.deadline || '';
  document.getElementById('gCategory').value = goal.category;
  document.getElementById('gPriority').value = goal.priority;
  openModal('addGoalModal');
}

function deleteGoal(id) {
  if (!confirm('Delete this goal?')) return;
  const goals = getGoals().filter(g => g.id !== id);
  store.set('goals', goals);
  loadGoals();
  showToast('Goal deleted.', 'info');
}

// Reset modal on open
document.getElementById('addGoalModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) {
    document.getElementById('goalId').value = '';
    document.getElementById('modalTitle').textContent = 'Add New Goal';
    document.getElementById('goalForm').reset();
  }
});

const origOpen = window.openModal;
window.openModal = function(id) {
  if (id === 'addGoalModal') {
    document.getElementById('goalId').value = '';
    document.getElementById('modalTitle').textContent = 'Add New Goal';
    document.getElementById('goalForm').reset();
  }
  origOpen(id);
};
</script>
</body>
</html>
