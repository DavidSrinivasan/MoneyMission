<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Money Mission</title>
  <link rel="stylesheet" href="global.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
<div id="money-bg"></div>
<a href="index.html" class="auth-back">&larr; Back to Home</a>

<div class="auth-page">
  <div class="glass auth-card">

    <div class="auth-logo">
      <div class="logo-icon"></div>
      <div class="logo-name">Money<span>Mission</span></div>
    </div>

    <div class="auth-heading">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-sub">Sign in to continue your financial journey</p>
    </div>

    <form class="auth-form" id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-control" type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
        <span class="field-error" id="emailErr">Please enter a valid email.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <input class="form-control" type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
          <button type="button" class="input-icon" id="togglePwd">Show</button>
        </div>
        <span class="field-error" id="pwdErr">Password must be at least 6 characters.</span>
      </div>

      <div class="auth-options">
        <label class="remember-wrap">
          <input type="checkbox" id="remember"/>
          <div class="custom-check"></div>
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="auth-btn" id="loginBtn">Sign In to Dashboard</button>

      <div class="auth-redirect">
        Don't have an account? <a href="signup.html">Create one free &rarr;</a>
      </div>
    </form>

    <div style="margin-top:20px;padding:12px;background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.15);border-radius:10px;font-size:12px;color:var(--text-secondary);text-align:center;">
      <strong style="color:var(--gold)">Demo:</strong> Use any email + any password (min 6 chars)
    </div>
  </div>
</div>

<script src="global.js"></script>
<script>
  // Override guardRoute — this is a public page
  function guardRoute() {}

  // Password toggle
  document.getElementById('togglePwd').addEventListener('click', function() {
    var p = document.getElementById('password');
    p.type = (p.type === 'password') ? 'text' : 'password';
    this.textContent = (p.type === 'text') ? 'Hide' : 'Show';
  });

  // Init background
  document.addEventListener('DOMContentLoaded', function() {
    initMoneyBackground();
  });

  // Form submit
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    var email = document.getElementById('email').value.trim();
    var pwd   = document.getElementById('password').value;
    var valid = true;

    document.getElementById('emailErr').classList.remove('show');
    document.getElementById('pwdErr').classList.remove('show');

    if (!email || email.indexOf('@') < 0 || email.indexOf('.') < 0) {
      document.getElementById('emailErr').classList.add('show');
      valid = false;
    }
    if (pwd.length < 6) {
      document.getElementById('pwdErr').classList.add('show');
      valid = false;
    }
    if (!valid) return;

    var btn = document.getElementById('loginBtn');
    btn.textContent = 'Signing in...';
    btn.disabled = true;

    setTimeout(function() {
      // Save user
      var name = email.split('@')[0]
        .replace(/[._-]/g, ' ')
        .replace(/\b\w/g, function(ch) { return ch.toUpperCase(); });
      try {
        localStorage.setItem('mm_user', JSON.stringify({
          name: name, email: email, joinedAt: new Date().toISOString()
        }));
      } catch(ex) {}

      // ---- THE FIX: build absolute URL from current location ----
      var url = window.location.protocol + '//' +
                window.location.host +
                window.location.pathname.replace(/\/[^\/]*$/, '/') +
                'dashboard.html';
      window.location.replace(url);
    }, 700);
  });
</script>
</body>
</html>
