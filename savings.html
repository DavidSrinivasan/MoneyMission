<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Money Mission</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/auth.css"/>
</head>
<body>
<div id="money-bg"></div>

<a href="../index.html" class="auth-back">← Back to Home</a>

<div class="auth-page">
  <div class="glass auth-card">
    <div class="auth-logo">
      <div class="logo-icon">💰</div>
      <div class="logo-name">Money<span>Mission</span></div>
    </div>

    <div class="auth-heading">
      <h1 class="auth-title">Welcome Back 👋</h1>
      <p class="auth-sub">Sign in to continue your financial journey</p>
    </div>

    <form class="auth-form" id="loginForm" novalidate>
      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrap">
          <input class="form-control" type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
          <span class="input-icon">✉️</span>
        </div>
        <span class="field-error" id="emailErr">Please enter a valid email.</span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <input class="form-control" type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
          <button type="button" class="input-icon" id="togglePwd" aria-label="Toggle password">👁️</button>
        </div>
        <span class="field-error" id="pwdErr">Password is required.</span>
      </div>

      <!-- Options -->
      <div class="auth-options">
        <label class="remember-wrap">
          <input type="checkbox" id="remember"/>
          <div class="custom-check"></div>
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="auth-btn" id="loginBtn">
        Sign In to Dashboard
      </button>

      <!-- Redirect -->
      <div class="auth-redirect">
        Don't have an account? <a href="signup.html">Create one free →</a>
      </div>
    </form>

    <!-- Demo hint -->
    <div style="margin-top:20px;padding:12px;background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.15);border-radius:10px;font-size:12px;color:var(--text-secondary);text-align:center;">
      💡 <strong style="color:var(--gold)">Demo:</strong> Use any email + password (min 6 chars) to log in
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../js/global.js"></script>
<script>
  // Override guardRoute for auth pages
  function guardRoute() {}

  const form   = document.getElementById('loginForm');
  const emailEl = document.getElementById('email');
  const pwdEl   = document.getElementById('password');
  const togglePwd = document.getElementById('togglePwd');

  // Show/hide password
  togglePwd.addEventListener('click', () => {
    const isText = pwdEl.type === 'text';
    pwdEl.type = isText ? 'password' : 'text';
    togglePwd.textContent = isText ? '👁️' : '🙈';
  });

  function validate() {
    let ok = true;
    const emailErr = document.getElementById('emailErr');
    const pwdErr   = document.getElementById('pwdErr');

    if (!emailEl.value || !/\S+@\S+\.\S+/.test(emailEl.value)) {
      emailErr.classList.add('show'); ok = false;
    } else { emailErr.classList.remove('show'); }

    if (!pwdEl.value || pwdEl.value.length < 6) {
      pwdErr.classList.add('show'); ok = false;
    } else { pwdErr.classList.remove('show'); }

    return ok;
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!validate()) return;

    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Signing in…';
    btn.disabled = true;

    // Simulate async login
    setTimeout(() => {
      const user = {
        name: emailEl.value.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
        email: emailEl.value,
        joinedAt: new Date().toISOString()
      };
      store.set('user', user);
      showToast('Welcome back, ' + user.name + '! 🎉', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
    }, 1000);
  });
</script>
</body>
</html>
