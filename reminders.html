<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reminders – Money Mission</title>
  <link rel="stylesheet" href="global.css"/>
  <link rel="stylesheet" href="dashboard.css"/>
</head>
<body>
<div id="money-bg"></div>
<div id="toast-container"></div>

<div class="app-layout">
  <main class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">🔔 Reminders</div>
        <div class="page-sub">Never miss a payment, SIP or financial deadline.</div>
      </div>
      <button class="btn btn-gold" onclick="openAddModal()">+ Add Reminder</button>
    </div>

    <!-- Type filters -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;" id="reminderTabs">
      <button class="btn btn-gold btn-sm"  data-f="all"     onclick="filterReminders('all',this)">All</button>
      <button class="btn btn-ghost btn-sm" data-f="daily"   onclick="filterReminders('daily',this)">Daily</button>
      <button class="btn btn-ghost btn-sm" data-f="weekly"  onclick="filterReminders('weekly',this)">Weekly</button>
      <button class="btn btn-ghost btn-sm" data-f="monthly" onclick="filterReminders('monthly',this)">Monthly</button>
      <button class="btn btn-ghost btn-sm" data-f="yearly"  onclick="filterReminders('yearly',this)">Yearly</button>
    </div>

    <div class="reminders-grid" id="remindersGrid"></div>
    <div id="remindersEmpty" style="display:none;text-align:center;padding:60px 20px;">
      <div style="font-size:52px;margin-bottom:16px;">🔔</div>
      <div style="font-family:var(--font-display);font-size:20px;font-weight:700;margin-bottom:8px;">No reminders</div>
      <div style="color:var(--text-secondary);font-size:14px;margin-bottom:24px;">Set up a reminder so you never miss anything important.</div>
      <button class="btn btn-gold" onclick="openAddModal()">Add First Reminder</button>
    </div>
  </main>
</div>

<!-- Reminder Modal -->
<div class="modal-overlay" id="reminderModal">
  <div class="glass modal">
    <div class="modal-header">
      <div class="modal-title" id="reminderModalTitle">Add Reminder</div>
      <button class="modal-close" onclick="closeModal('reminderModal')">×</button>
    </div>
    <form id="reminderForm" style="display:flex;flex-direction:column;gap:16px;">
      <input type="hidden" id="remId"/>
      <div class="form-group">
        <label class="form-label">Title</label>
        <input class="form-control" id="remTitle" placeholder="e.g. Pay Credit Card Bill" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <input class="form-control" id="remDesc" placeholder="Optional note…"/>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="form-group">
          <label class="form-label">Type</label>
          <select class="form-control" id="remType">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly" selected>Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Time</label>
          <input class="form-control" id="remTime" type="time" value="09:00"/>
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input class="form-control" id="remDate" type="date"/>
        </div>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%;padding:14px;">Save Reminder</button>
    </form>
  </div>
</div>

<script src="global.js"></script>
<script src="layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderLayout('reminders.html', 'Reminders');
  initMoneyBackground();
  initSidebar();
  loadReminders();
});

let remFilter = 'all';

const stripeMap = { daily:'stripe-daily', weekly:'stripe-weekly', monthly:'stripe-monthly', yearly:'stripe-yearly' };
const typeColors = { daily:'var(--gold)', weekly:'var(--green)', monthly:'var(--blue)', yearly:'var(--red)' };

function getReminders() {
  const saved = store.get('reminders', null);
  if (saved) return saved;
  const defaults = [
    { id:'1', title:'Pay Credit Card',    desc:'HDFC Credit card bill',  type:'monthly', date:'2025-06-15', time:'10:00', done:false },
    { id:'2', title:'SIP Investment',     desc:'Nifty 50 mutual fund',   type:'monthly', date:'2025-06-01', time:'08:00', done:true  },
    { id:'3', title:'Weekly Groceries',   desc:'Buy essentials for week', type:'weekly',  date:'2025-06-07', time:'18:00', done:false },
    { id:'4', title:'Daily Expense Log',  desc:'Record today's expenses', type:'daily',   date:'2025-06-06', time:'21:00', done:false },
    { id:'5', title:'Annual Insurance',   desc:'Renew health insurance',  type:'yearly',  date:'2025-12-01', time:'09:00', done:false },
  ];
  store.set('reminders', defaults);
  return defaults;
}

function loadReminders() {
  const reminders = getReminders();
  const grid  = document.getElementById('remindersGrid');
  const empty = document.getElementById('remindersEmpty');
  const filtered = remFilter === 'all' ? reminders : reminders.filter(r => r.type === remFilter);

  if (!filtered.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(r => `
    <div class="glass reminder-card${r.done ? ' done' : ''}">
      <div class="reminder-type-stripe ${stripeMap[r.type]}"></div>
      <div class="reminder-header">
        <div>
          <div class="reminder-title">${r.title}</div>
          <span class="badge" style="background:rgba(255,255,255,0.05);color:${typeColors[r.type]};border:1px solid ${typeColors[r.type]}30;margin-top:4px;">${r.type}</span>
        </div>
        <div style="display:flex;gap:6px;margin-left:8px;">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="editReminder('${r.id}')" title="Edit">✏️</button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="deleteReminder('${r.id}')" title="Delete">🗑️</button>
        </div>
      </div>
      ${r.desc ? `<div class="reminder-desc">${r.desc}</div>` : ''}
      <div class="reminder-footer">
        <div class="reminder-datetime">
          📅 ${formatDate(r.date)} &nbsp; ⏰ ${r.time}
        </div>
        <button class="btn btn-sm ${r.done ? 'btn-ghost' : 'btn-green'}" onclick="toggleDone('${r.id}')">
          ${r.done ? '↩ Undo' : '✓ Done'}
        </button>
      </div>
    </div>
  `).join('');
}

function filterReminders(f, btn) {
  remFilter = f;
  document.querySelectorAll('#reminderTabs .btn').forEach(b => {
    b.className = b === btn ? 'btn btn-gold btn-sm' : 'btn btn-ghost btn-sm';
  });
  loadReminders();
}

function openAddModal() {
  document.getElementById('reminderModalTitle').textContent = 'Add Reminder';
  document.getElementById('remId').value = '';
  document.getElementById('reminderForm').reset();
  document.getElementById('remTime').value = '09:00';
  openModal('reminderModal');
}

function editReminder(id) {
  const r = getReminders().find(r => r.id === id);
  if (!r) return;
  document.getElementById('reminderModalTitle').textContent = 'Edit Reminder';
  document.getElementById('remId').value    = r.id;
  document.getElementById('remTitle').value = r.title;
  document.getElementById('remDesc').value  = r.desc || '';
  document.getElementById('remType').value  = r.type;
  document.getElementById('remDate').value  = r.date || '';
  document.getElementById('remTime').value  = r.time || '09:00';
  openModal('reminderModal');
}

function deleteReminder(id) {
  if (!confirm('Delete this reminder?')) return;
  store.set('reminders', getReminders().filter(r => r.id !== id));
  loadReminders();
  showToast('Reminder deleted.', 'info');
}

function toggleDone(id) {
  const list = getReminders();
  const r = list.find(r => r.id === id);
  if (r) r.done = !r.done;
  store.set('reminders', list);
  loadReminders();
  showToast(r.done ? 'Reminder marked complete ✅' : 'Reminder reopened.', r.done ? 'success' : 'info');
}

document.getElementById('reminderForm').addEventListener('submit', e => {
  e.preventDefault();
  const id = document.getElementById('remId').value;
  const list = getReminders();
  const item = {
    id: id || Date.now().toString(),
    title: document.getElementById('remTitle').value.trim(),
    desc:  document.getElementById('remDesc').value.trim(),
    type:  document.getElementById('remType').value,
    date:  document.getElementById('remDate').value,
    time:  document.getElementById('remTime').value,
    done:  false,
  };
  if (!item.title) return showToast('Please enter a title.', 'error');
  if (id) { const idx = list.findIndex(r => r.id === id); if (idx > -1) { item.done = list[idx].done; list[idx] = item; } }
  else list.push(item);
  store.set('reminders', list);
  closeModal('reminderModal');
  loadReminders();
  showToast(id ? 'Reminder updated! 🔔' : 'Reminder added! 🔔', 'success');
});
</script>
</body>
</html>
