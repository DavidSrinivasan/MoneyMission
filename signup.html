<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – Money Mission</title>
  <link rel="stylesheet" href="global.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
<div id="money-bg"></div>
<a href="index.html" class="auth-back">← Back to Home</a>

<div class="auth-page">
  <div class="glass auth-card" style="max-width:460px;">
    <div class="auth-logo">
      <div class="logo-icon">💰</div>
      <div class="logo-name">Money<span>Mission</span></div>
    </div>

    <div class="auth-heading">
      <h1 class="auth-title">Create Account 🚀</h1>
      <p class="auth-sub">Start your journey to financial freedom today</p>
    </div>

    <form class="auth-form" id="signupForm" novalidate>
      <!-- Full Name -->
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <div class="input-wrap">
          <input class="form-control" type="text" id="fullName" placeholder="Arjun Sharma" autocomplete="name"/>
          <span class="input-icon">👤</span>
        </div>
        <span class="field-error" id="nameErr">Please enter your full name.</span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrap">
          <input class="form-control" type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
          <span class="input-icon">✉️</span>
        </div>
        <span class="field-error" id="emailErr">Please enter a valid email.</span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <input class="form-control" type="password" id="password" placeholder="Create a strong password" autocomplete="new-password"/>
          <button type="button" class="input-icon" id="togglePwd">👁️</button>
        </div>
        <!-- Strength indicator -->
        <div class="pwd-strength-wrap" id="strengthWrap" style="display:none">
          <div class="pwd-strength-bars">
            <div class="pwd-bar" id="bar1"></div>
            <div class="pwd-bar" id="bar2"></div>
            <div class="pwd-bar" id="bar3"></div>
            <div class="pwd-bar" id="bar4"></div>
          </div>
          <span class="pwd-strength-label" id="strengthLabel">Too weak</span>
        </div>
        <span class="field-error" id="pwdErr">Password must be at least 8 characters.</span>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label class="form-label" for="confirmPwd">Confirm Password</label>
        <div class="input-wrap">
          <input class="form-control" type="password" id="confirmPwd" placeholder="Repeat your password" autocomplete="new-password"/>
          <button type="button" class="input-icon" id="toggleCnf">👁️</button>
        </div>
        <span class="field-error" id="cnfErr">Passwords do not match.</span>
      </div>

      <!-- T&C -->
      <label class="remember-wrap" style="font-size:13px;color:var(--text-secondary);">
        <input type="checkbox" id="agree"/>
        <div class="custom-check"></div>
        I agree to the <a href="#" style="color:var(--gold);margin-left:3px;">Terms & Privacy Policy</a>
      </label>
      <span class="field-error" id="agreeErr">You must agree to the terms.</span>

      <button type="submit" class="auth-btn" id="signupBtn">Create My Account</button>

      <div class="auth-redirect">
        Already have an account? <a href="login.html">Sign in →</a>
      </div>
    </form>
  </div>
</div>

<div id="toast-container"></div>
<script src="global.js"></script>
<script>
  function guardRoute() {}

  const pwdEl  = document.getElementById('password');
  const cnfEl  = document.getElementById('confirmPwd');

  // Toggle passwords
  document.getElementById('togglePwd').addEventListener('click', () => {
    const isText = pwdEl.type === 'text';
    pwdEl.type = isText ? 'password' : 'text';
    document.getElementById('togglePwd').textContent = isText ? '👁️' : '🙈';
  });
  document.getElementById('toggleCnf').addEventListener('click', () => {
    const isText = cnfEl.type === 'text';
    cnfEl.type = isText ? 'password' : 'text';
    document.getElementById('toggleCnf').textContent = isText ? '👁️' : '🙈';
  });

  // Password strength
  pwdEl.addEventListener('input', () => {
    const val = pwdEl.value;
    const wrap = document.getElementById('strengthWrap');
    if (!val) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';

    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val))   score++;
    if (/[0-9]/.test(val))   score++;
    if (/[^a-zA-Z0-9]/.test(val)) score++;

    const bars   = ['bar1','bar2','bar3','bar4'].map(id => document.getElementById(id));
    const labels = ['Too Weak', 'Weak', 'Good', 'Strong'];
    const classes= ['weak','weak','medium','strong'];
    bars.forEach((b, i) => {
      b.className = 'pwd-bar' + (i < score ? ' ' + classes[score - 1] : '');
    });
    const lbl = document.getElementById('strengthLabel');
    lbl.textContent = labels[score - 1] || 'Too Weak';
    lbl.style.color = score <= 1 ? 'var(--red)' : score === 2 ? '#f0cc5a' : score === 3 ? 'var(--blue)' : 'var(--green)';
  });

  // Form validation & submit
  document.getElementById('signupForm').addEventListener('submit', e => {
    e.preventDefault();
    let ok = true;

    const nameEl  = document.getElementById('fullName');
    const emailEl = document.getElementById('email');
    const agreeEl = document.getElementById('agree');

    const show = (id, show) => document.getElementById(id).classList.toggle('show', show);

    show('nameErr',  !nameEl.value.trim() || nameEl.value.trim().length < 2);
    if (!nameEl.value.trim() || nameEl.value.trim().length < 2) ok = false;

    show('emailErr', !emailEl.value || !/\S+@\S+\.\S+/.test(emailEl.value));
    if (!emailEl.value || !/\S+@\S+\.\S+/.test(emailEl.value)) ok = false;

    show('pwdErr', !pwdEl.value || pwdEl.value.length < 8);
    if (!pwdEl.value || pwdEl.value.length < 8) ok = false;

    show('cnfErr', pwdEl.value !== cnfEl.value);
    if (pwdEl.value !== cnfEl.value) ok = false;

    show('agreeErr', !agreeEl.checked);
    if (!agreeEl.checked) ok = false;

    if (!ok) return;

    const btn = document.getElementById('signupBtn');
    btn.textContent = 'Creating account…';
    btn.disabled = true;

    setTimeout(() => {
      const user = {
        name:  nameEl.value.trim(),
        email: emailEl.value.trim(),
        joinedAt: new Date().toISOString()
      };
      store.set('user', user);
      showToast('Account created! Welcome to Money Mission 🎉', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
    }, 1100);
  });
</script>
</body>
</html>
